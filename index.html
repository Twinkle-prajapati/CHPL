<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <h1>Dice Game</h1>
        <div class="players">
            <div class="player">
                <label for="player1">Player 1 Name:</label>
                <input type="text" id="player1" placeholder="Enter Player 1 Name">
            </div>
            <div class="player">
                <label for="player2">Player 2 Name:</label>
                <input type="text" id="player2" placeholder="Enter Player 2 Name">
            </div>
        </div>
        <div class="dice-container">
            <div class="dice" id="dice1"><img src="Assets/dice6.png"></div>
            <div class="dice" id="dice2"><img src="Assets/dice6.png"></div>
        </div>
        <div class="dice-score">
            <div id="dice1_score">
                <p>Score:</p>
            </div>
            <div id="dice2_score">
                <p>Score:</p>
            </div>
        </div>
        <button id="rollDice">Roll the Dice</button>
        <div id="winner">
            <h3></h3>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
